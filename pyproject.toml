[project]
name = "goalcatcher"
version = "0.1.0"
description = "Firestore-backed football threshold monitor and Telegram alerts"
requires-python = ">=3.11"
dependencies = [
    "google-auth[requests]>=2.38,<3",
    "google-cloud-firestore>=2.29,<3",
    "google-cloud-secret-manager>=2.24,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

# src/ is imported in place (see tool.pytest pythonpath); there is nothing to build.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
