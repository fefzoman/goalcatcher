name: Deploy Application

# Ships the application onto the VM that infra/compute-engine provisions.
# Terraform only initializes the host (user, uv, venv, /etc/football-goal-alert.env
# and the unit file); application files are a separate, replaceable artifact — so
# this also has to be re-run manually after the VM is replaced.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'deploy/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  id-token: write          # Workload Identity Federation
  contents: read

concurrency:
  group: deploy-vm
  cancel-in-progress: false   # never interrupt a half-installed release

env:
  # Mirror of infra/globals.tm.hcl. Override with repo variables if globals change.
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'goalcatcher-508312' }}
  GCE_INSTANCE: ${{ vars.GCE_INSTANCE || 'football-goal-alert' }}
  GCE_ZONE: ${{ vars.GCE_ZONE || 'europe-central2-a' }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX || 'football-goal-alert' }}
  APP_DIR: /opt/football-goal-alert
  APP_USER: football-alert
  SERVICE: football-goal-alert

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # The unit has ConditionPathExists=/opt/football-goal-alert/.env, so the
      # file must exist or the service silently refuses to start. It is gitignored
      # (it is per-deployment config), so CI composes it.
      #
      # Deliberately omits GOOGLE_CLOUD_PROJECT and FIRESTORE_DATABASE_ID:
      # Terraform writes those into /etc/football-goal-alert.env, and .env is the
      # SECOND EnvironmentFile, so anything set here would silently override
      # Terraform. Only values Terraform does not own belong in this file.
      - name: Compose .env (non-secret configuration only)
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Kyiv' }}
          SHEETS_ID: ${{ vars.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          {
            echo "# Generated by .github/workflows/deploy.yml — do not edit on the VM."
            echo "API_FOOTBALL_KEY_SECRET_ID=${NAME_PREFIX}-api-football-key"
            echo "TELEGRAM_BOT_TOKEN_SECRET_ID=${NAME_PREFIX}-telegram-bot-token"
            echo "TELEGRAM_CHAT_ID_SECRET_ID=${NAME_PREFIX}-telegram-chat-id"
            echo "TIMEZONE=${TIMEZONE}"
            if [ -n "${SHEETS_ID:-}" ]; then
              echo "GOOGLE_SHEETS_SPREADSHEET_ID=${SHEETS_ID}"
            fi
          } > .env

          # src/config.py refuses to start if a credential is passed through the
          # environment; fail here rather than after the service is already down.
          if grep -qE '^(API_FOOTBALL_KEY|TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID)=' .env; then
            echo "::error::.env must carry Secret Manager IDs, never credential values."
            exit 1
          fi
          echo "Composed .env:"; sed 's/^/  /' .env

      - name: Package release
        run: |
          set -euo pipefail
          tar --exclude='__pycache__' -czf release.tar.gz \
            src config pyproject.toml uv.lock deploy/football-goal-alert.service .env
          ls -lh release.tar.gz

      # Both scripts run as root on the VM and are idempotent: safe to re-run on
      # an unchanged commit. They are shipped as files rather than piped through
      # `ssh --command` stdin, which is not reliably forwarded.
      - name: Build remote scripts
        run: |
          cat > remote-install.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          APP_DIR="$1"; APP_USER="$2"; SERVICE="$3"; ARCHIVE="$4"

          echo "--- stopping $SERVICE ---"
          systemctl stop "$SERVICE" || true

          echo "--- installing files ---"
          tar -xzf "$ARCHIVE" -C "$APP_DIR"
          chown -R "$APP_USER:$APP_USER" "$APP_DIR"
          chmod 600 "$APP_DIR/.env"

          echo "--- uv sync ---"
          cd "$APP_DIR"
          sudo -H -u "$APP_USER" uv sync --frozen --no-dev

          echo "--- systemd unit ---"
          install -m 0644 "$APP_DIR/deploy/football-goal-alert.service" \
            "/etc/systemd/system/$SERVICE.service"

          # Offline validation before anything starts: no API calls, no writes.
          echo "--- validating configuration ---"
          sudo -u "$APP_USER" "$APP_DIR/.venv/bin/python" -m src.monitor --check-config

          echo "--- starting $SERVICE ---"
          systemctl daemon-reload
          systemctl enable "$SERVICE"
          systemctl restart "$SERVICE"

          rm -f "$ARCHIVE"
          EOS

          # Restart=always/RestartSec=15 would mask a crash loop behind a green
          # restart, so settle first, then assert active AND that it never flapped.
          # `systemctl restart` zeroes NRestarts, so any restart here is a crash.
          cat > remote-verify.sh <<'EOS'
          #!/usr/bin/env bash
          set -uo pipefail
          SERVICE="$1"
          sleep 25

          echo "--- journal ---"
          journalctl -u "$SERVICE" -n 60 --no-pager || true
          echo "---------------"

          enabled=$(systemctl is-enabled "$SERVICE" 2>&1 || true)
          active=$(systemctl is-active "$SERVICE" 2>&1 || true)
          restarts=$(systemctl show -p NRestarts --value "$SERVICE" 2>/dev/null || echo 0)
          echo "enabled=$enabled active=$active restarts=$restarts"

          [ "$active" = "active" ]   || { echo "::error::$SERVICE is $active"; exit 1; }
          [ "$enabled" = "enabled" ] || { echo "::error::$SERVICE is $enabled"; exit 1; }
          [ "${restarts:-0}" -eq 0 ] || { echo "::error::$SERVICE restarted $restarts times since deploy - crash loop."; exit 1; }
          echo "$SERVICE is active, enabled and stable."
          EOS

          bash -n remote-install.sh && bash -n remote-verify.sh
          echo "remote scripts syntax OK"

      - name: Copy release to the VM
        run: |
          gcloud compute scp release.tar.gz remote-install.sh remote-verify.sh \
            "${GCE_INSTANCE}:~/" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --tunnel-through-iap \
            --quiet

      - name: Install and restart
        run: |
          gcloud compute ssh "$GCE_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo bash \$HOME/remote-install.sh '$APP_DIR' '$APP_USER' '$SERVICE' \$HOME/release.tar.gz"

      - name: Verify the service is healthy
        run: |
          gcloud compute ssh "$GCE_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo bash \$HOME/remote-verify.sh '$SERVICE'"
