name: Terramate Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'deploy/football-goal-alert.service'   # watched by the compute-engine stack
      - '**/*.tm.hcl'
  # Manual plan-only preview, selected by tag or folder_path.
  workflow_dispatch:
    inputs:
      tag:
        description: "Terramate tag to plan, e.g. networking (empty = all stacks)"
        required: false
        type: string
      folder_path:
        description: "Stack folder to plan, e.g. infra/compute-engine (mutually exclusive with tag)"
        required: false
        type: string

permissions:
  id-token: write          # Workload Identity Federation
  contents: read
  pull-requests: write

env:
  TF_VERSION: ${{ vars.TF_VERSION || '1.16.0' }}
  TM_VERSION: ${{ vars.TM_VERSION || '0.17.1' }}
  TF_IN_AUTOMATION: 'true'

jobs:
  # There is ONE environment (every stack is tagged `production`), so there is no
  # per-env `changes` gate and no tag filter — Terramate's own change detection
  # against origin/main selects the stacks to plan.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0                     # full history: change detection needs it

      - name: Fetch base for change detection
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - uses: terramate-io/terramate-action@v3
        with:
          version: ${{ env.TM_VERSION }}
          bindir: ${{ runner.temp }}/terramate-bin
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - run: terramate generate

      - name: Detect changed stacks
        id: detect
        run: |
          n=$(terramate list --changed --git-change-base origin/main | grep -c . || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Plan changed stacks
        id: plan
        if: steps.detect.outputs.count != '0'
        run: |
          terramate run --parallel 5 --changed --git-change-base origin/main -- terraform init -input=false
          terramate run --parallel 5 --changed --git-change-base origin/main -- terraform plan -input=false -lock=false -out out.tfplan

      - name: Build plan comment
        if: always()
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          STACK_COUNT: ${{ steps.detect.outputs.count }}
        run: |
          {
            echo "### Terraform plan"
            echo
            if [ "${STACK_COUNT:-0}" = "0" ]; then
              echo "> ℹ️ No Terramate stack changed — nothing to plan."
            else
              echo "<details><summary>Selected stacks</summary>"
              echo
              echo '```'
              terramate list --changed --git-change-base origin/main || true
              echo '```'
              echo "</details>"
              echo
              echo '```terraform'
              terramate run --changed --git-change-base origin/main -- terraform show -no-color out.tfplan 2>&1 | head -c 60000 || true
              echo
              echo '```'
              echo
              if [ "$PLAN_OUTCOME" = "success" ]; then
                echo "> ✅ Plan is green. Merging to \`main\` applies these changes automatically."
              else
                echo "> ❌ Plan failed — fix it before merging."
              fi
            fi
          } > pr-comment.txt

      - name: Publish plan comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: terraform-plan
          path: pr-comment.txt

  # ------------------------------------------------- manual dispatch: plan only
  # Plans by tag or folder_path (no change detection).
  plan-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve selection
        id: sel
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FOLDER_PATH: ${{ inputs.folder_path }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          folder_path="${INPUT_FOLDER_PATH#./}"; folder_path="${folder_path%/}"

          if [ -n "$tag" ] && [ -n "$folder_path" ]; then
            echo "::error::Provide either tag or folder_path, not both."; exit 1
          fi
          if [ -n "$tag" ]; then
            case "$tag" in *[!A-Za-z0-9_.:-]*) echo "::error::tag may only contain letters, numbers, '.', '_', '-', ':'."; exit 1;; esac
          fi

          if [ -n "$folder_path" ]; then
            case "$folder_path" in
              /*|*..*|*[!A-Za-z0-9_./-]*) echo "::error::folder_path must be a relative path without '..'."; exit 1;;
            esac
            case "$folder_path" in
              infra|infra/*) ;;
              *) echo "::error::folder_path must be under infra/."; exit 1;;
            esac
            [ -d "$folder_path" ] || { echo "::error::folder_path does not exist: $folder_path"; exit 1; }
            echo "mode=path" >>"$GITHUB_OUTPUT"
            echo "chdir=$folder_path" >>"$GITHUB_OUTPUT"
          elif [ -n "$tag" ]; then
            echo "mode=tag" >>"$GITHUB_OUTPUT"
            echo "tags=$tag" >>"$GITHUB_OUTPUT"
          else
            # Every stack carries the `production` tag = the whole environment.
            echo "mode=tag" >>"$GITHUB_OUTPUT"
            echo "tags=production" >>"$GITHUB_OUTPUT"
          fi

      - uses: terramate-io/terramate-action@v3
        with:
          version: ${{ env.TM_VERSION }}
          bindir: ${{ runner.temp }}/terramate-bin
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - run: terramate generate

      - name: Plan selected stacks
        env:
          TM_MODE: ${{ steps.sel.outputs.mode }}
          TM_CHDIR: ${{ steps.sel.outputs.chdir }}
          TM_TAGS: ${{ steps.sel.outputs.tags }}
        run: |
          set -euo pipefail
          case "$TM_MODE" in
            path) args=(--parallel 5 -C "$TM_CHDIR");;
            tag)  args=(--parallel 5 --tags "$TM_TAGS");;
            *)    echo "::error::unsupported mode: $TM_MODE"; exit 1;;
          esac
          terramate run "${args[@]}" -- terraform init -input=false
          terramate run "${args[@]}" -- terraform plan -input=false -no-color -lock=false
